<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PERSONALIZAR: título e descrição da página -->
  <title>Integra Proteção Veicular | Cotação grátis</title>
  <meta name="description" content="Proteção veicular com guincho, pane elétrica, pane mecânica, colisão e suporte 24h. Faça sua cotação grátis pelo WhatsApp.">
  <meta name="theme-color" content="#98C61D">
  <!-- Segurança: de onde a página pode carregar scripts e para onde pode enviar dados.
       PERSONALIZAR: ao ter a URL definitiva do intermediário, troque https://*.easypanel.host por ela. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.easypanel.host https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="assets/escudo-ativo.svg" type="image/svg+xml">

  <!-- PERSONALIZAR: fonte (trocar também --font-base em css/styles.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">

  <link rel="stylesheet" href="css/styles.css">
  <!-- Esconde o carro até a animação de entrada começar (evita aparecer parado e "pular").
       Se algo falhar, ele reaparece sozinho em 2,5 s. -->
  <script>
    document.documentElement.classList.add("car-intro");
    setTimeout(function () { document.documentElement.classList.remove("car-intro"); }, 2500);
  </script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <!-- 1. CABEÇALHO FIXO -->
  <header class="header" id="topo">
    <div class="container header__inner">
      <a class="header__logo" href="#inicio" aria-label="Integra Proteção Veicular, voltar ao início">
        <!-- PERSONALIZAR: logo (assets/logo.svg) -->
        <img src="assets/logo.svg" alt="" width="148" height="40">
      </a>
      <button class="header__toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="header__nav" id="menu" aria-label="Principal">
        <ul class="header__links" data-render="nav"></ul>
        <a class="btn btn--primary btn--sm" href="#cotacao">Cotação grátis</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">

    <!-- 2. HERO: banner com o carro + cartão sobreposto + painel verde
         O carro entra pela direita conforme a rolagem e estaciona à direita do banner.
         Sem JS ou com movimento reduzido, ele já aparece estacionado. -->
    <section class="hero" id="inicio" aria-labelledby="hero-titulo">
      <div class="container">
        <div class="hero__banner">
          <!-- PERSONALIZAR: marca d'água (versão branca do selo em assets/selo-integra.png) -->
          <picture class="hero__watermark" aria-hidden="true">
            <source srcset="assets/marca-dagua.webp" type="image/webp">
            <img src="assets/marca-dagua.png" alt="" width="444" height="444">
          </picture>
          <p class="hero__display" data-accent data-text="hero.display">Proteção veicular.</p>
          <!-- PERSONALIZAR: foto do carro (fundo transparente, virado para a esquerda) -->
          <picture class="hero__car" aria-hidden="true">
            <source srcset="assets/carro.webp" type="image/webp">
            <img src="assets/carro.png" alt="" width="674" height="370" fetchpriority="high">
          </picture>
        </div>

        <div class="hero__grid">
          <div class="hero__col hero__col--main">
            <div class="hero__intro">
              <p class="eyebrow" data-text="hero.selo"></p>
              <h1 id="hero-titulo" class="hero__title" data-accent data-text="hero.titulo">Não deixe seu carro desprotegido!</h1>
              <p class="hero__subtitle" data-text="hero.subtitulo"></p>
            </div>
            <ul class="hero__rows" data-render="linhas"></ul>
          </div>

          <div class="hero__col hero__col--side">
            <div class="hero__panel">
              <p class="hero__tip" data-text="hero.dica"></p>
              <ul class="hero__tiles" data-render="atalhos"></ul>
            </div>

            <form class="hero__cta quote-form" id="cotacao" novalidate aria-labelledby="form-titulo">
              <h2 class="quote-form__title" id="form-titulo" data-text="hero.formTitulo"></h2>
              <div class="field">
                <label for="f-nome" data-text="hero.campos.nome"></label>
                <input id="f-nome" name="nome" type="text" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="f-whats" data-text="hero.campos.whatsapp"></label>
                <input id="f-whats" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" required>
              </div>
              <div class="field">
                <label for="f-veiculo" data-text="hero.campos.veiculo"></label>
                <input id="f-veiculo" name="veiculo" type="text" autocomplete="off" placeholder="Ex.: ABC1D23 ou Onix 2020" required>
              </div>
              <p class="quote-form__error" role="alert" hidden></p>
              <button class="btn btn--light btn--block" type="submit">
                <span data-icon="whatsapp"></span><span data-text="hero.botao"></span>
              </button>
              <p class="quote-form__note" data-text="hero.formNota"></p>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. SERVIÇOS -->
    <section class="section" id="servicos" aria-labelledby="servicos-titulo">
      <div class="container">
        <h2 id="servicos-titulo" class="section-title" data-accent data-text="servicos.titulo"></h2>
        <p class="section-subtitle" data-text="servicos.subtitulo"></p>
        <ul class="services" data-render="servicos"></ul>
      </div>
    </section>

    <!-- 5. COMO FUNCIONA -->
    <section class="section section--soft" id="como-funciona" aria-labelledby="passos-titulo">
      <div class="container">
        <h2 id="passos-titulo" class="section-title" data-accent data-text="passos.titulo"></h2>
        <ol class="steps" data-render="passos"></ol>
      </div>
    </section>

    <!-- 6. PLANOS (sem preço) -->
    <section class="section" id="planos" aria-labelledby="planos-titulo">
      <div class="container">
        <h2 id="planos-titulo" class="section-title" data-accent data-text="planos.titulo"></h2>
        <p class="section-subtitle" data-text="planos.subtitulo"></p>
        <div class="plans" data-render="planos"></div>
        <p class="sample-note" data-text="planos.nota"></p>
      </div>
    </section>

    <!-- 7. DEPOIMENTOS (exemplo) -->
    <section class="section section--soft" id="depoimentos" aria-labelledby="depo-titulo">
      <div class="container">
        <h2 id="depo-titulo" class="section-title" data-accent data-text="depoimentos.titulo"></h2>
        <p class="sample-note sample-note--top" data-text="depoimentos.nota"></p>
        <ul class="testimonials" data-render="depoimentos"></ul>
      </div>
    </section>

    <!-- 8. PERGUNTAS FREQUENTES + GLOSSÁRIO -->
    <section class="section" id="duvidas" aria-labelledby="faq-titulo">
      <div class="container faq-grid">
        <div>
          <h2 id="faq-titulo" class="section-title" data-accent data-text="faq.titulo"></h2>
          <div class="faq" data-render="faq"></div>
        </div>
        <aside class="glossary" aria-labelledby="glossario-titulo">
          <h3 id="glossario-titulo" data-text="glossario.titulo"></h3>
          <dl data-render="glossario"></dl>
        </aside>
      </div>
    </section>

    <!-- 9. CONTATO -->
    <section class="section contact" id="contato" aria-labelledby="contato-titulo">
      <div class="container contact__inner">
        <div class="contact__cta">
          <h2 id="contato-titulo" class="section-title" data-accent data-text="contato.titulo"></h2>
          <p class="section-subtitle" data-text="contato.subtitulo"></p>
          <a class="btn btn--dark btn--lg" data-wa href="#">
            <span data-icon="whatsapp"></span><span data-text="contato.botao"></span>
          </a>
          <p class="contact__whats" data-text="contatos.whatsapp"></p>
        </div>
        <ul class="contact-card" data-render="contato"></ul>
      </div>
    </section>
  </main>

  <noscript>
    <p class="noscript">Para pedir sua cotação, fale com a Integra pelo WhatsApp (00) 00000-0000 ou pelo e-mail contato@exemplo.com.br.</p>
  </noscript>

  <!-- 10. RODAPÉ -->
  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <img src="assets/logo.svg" alt="Integra Proteção Veicular" width="148" height="40">
        <p data-text="empresa.razaoSocial"></p>
        <p data-render="cnpj"></p>
        <p data-text="empresa.endereco"></p>
      </div>
      <nav aria-label="Redes sociais">
        <h2 class="footer__heading">Redes sociais</h2>
        <ul class="footer__list" data-render="redes"></ul>
      </nav>
      <div>
        <h2 class="footer__heading">Institucional</h2>
        <ul class="footer__list">
          <li><button class="link-button" type="button" data-open="privacidade">Política de privacidade (LGPD)</button></li>
          <li><a href="#duvidas">Perguntas frequentes</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
      </div>
    </div>
    <div class="container footer__legal">
      <p data-text="empresa.avisoLegal"></p>
      <p data-render="copyright"></p>
    </div>
  </footer>

  <!-- Política de privacidade (texto em content.js) -->
  <dialog class="dialog" id="privacidade" aria-labelledby="priv-titulo">
    <div class="dialog__body">
      <h2 id="priv-titulo" data-text="privacidade.titulo"></h2>
      <div data-render="privacidade"></div>
      <form method="dialog"><button class="btn btn--primary">Fechar</button></form>
    </div>
  </dialog>

  <!-- 2ª via de boleto: textos em content.js; consulta segura pelo intermediário em server/ -->
  <dialog class="dialog" id="boleto" aria-labelledby="boleto-titulo" aria-describedby="boleto-texto">
    <div class="dialog__body">
      <h2 id="boleto-titulo" data-text="boleto.titulo"></h2>
      <p id="boleto-texto" data-text="boleto.texto"></p>
      <form class="boleto-form" novalidate>
        <div class="field">
          <label for="b-placa" data-text="boleto.campos.placa"></label>
          <input id="b-placa" name="placa" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="ABC1D23" required>
        </div>
        <div class="field">
          <label for="b-cpf" data-text="boleto.campos.cpf"></label>
          <input id="b-cpf" name="cpf" type="text" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required>
        </div>
        <div class="boleto-form__captcha" id="boleto-turnstile"></div>
        <p class="quote-form__error" role="alert" hidden></p>
        <p class="boleto-form__ok" role="status" hidden></p>
        <div class="boleto-form__acoes">
          <button class="btn btn--primary" type="submit" data-text="boleto.botao"></button>
          <button class="btn btn--outline" type="button" data-close>Fechar</button>
        </div>
        <p class="boleto-form__aviso" data-text="boleto.aviso"></p>
      </form>
    </div>
  </dialog>

  <!-- Botão flutuante de WhatsApp -->
  <a class="wa-float" data-wa href="#" aria-label="Falar com a Integra pelo WhatsApp">
    <span data-icon="whatsapp"></span>
  </a>

  <!-- Conteúdo primeiro, depois GSAP (versão fixa) e o script principal -->
  <script src="content/content.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Reserva local do GSAP (mesma versão) caso o CDN não carregue ou o site abra offline -->
  <script>
    window.gsap || document.write('<script src="js/vendor/gsap-3.12.5.min.js"><\/script>');
  </script>
  <script src="js/main.js"></script>
</body>
</html>
